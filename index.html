block;margin-top:9px;color:#897caf;font-size:12px}.dialogue-options{display:grid;gap:11px}.dialogue-option{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:15px;padding:15px;font-weight:800;font-size:16px}.dialogue-option span{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-top:5px}.dialogue-option.correct{border-color:var(--mint);background:var(--mint-bg)}.dialogue-option.incorrect{border-color:var(--red);background:var(--red-bg)}.end-badge{display:grid;place-items:center;font-size:65px;width:112px;height:112px;border-radius:50%;background:#fff0cf;margin:0 auto 25px}.complete{text-align:center;max-width:640px;margin:40px auto}.complete .score{font-size:54px;font-weight:950;color:var(--violet);letter-spacing:-2px;margin:10px 0}.complete .detail{color:var(--muted);font-size:14px;max-width:490px;margin:0 auto 24px}.complete-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.helper{font-size:12px;color:var(--muted);line-height:1.6}.empty-state{text-align:center;padding:42px 20px;color:var(--muted)}.empty-state .em{font-size:48px;margin-bottom:14px}.center-wrap{max-width:740px;margin:0 auto}.mic-status{padding:13px;background:var(--violet-pale);border-radius:12px;font-size:13px;margin-top:15px}.mic-result{padding:16px;background:var(--mint-bg);border-radius:15px;margin-top:15px}.settings-list{display:grid;gap:13px}.settings-row{padding:17px 0;border-bottom:1px solid var(--line);display:flex;gap:16px;justify-content:space-between;align-items:center}.settings-row:last-child{border:none}.settings-row b{font-size:14px}.settings-row p{font-size:12px;margin:4px 0 0;color:var(--muted)}.radio-inline{display:flex;gap:6px}.radio-inline button{padding:10px 13px;border:1px solid var(--line);background:white;border-radius:11px;color:var(--muted);font-size:12px;font-weight:850}.radio-inline button.selected{background:var(--violet-pale);color:var(--violet);border-color:#cdbffa}#toast{position:fixed;z-index:99;left:50%;bottom:34px;transform:translate(-50%,90px);opacity:0;background:#292a50;color:white;border-radius:13px;padding:13px 20px;box-shadow:0 9px 25px #1113;font-size:13px;font-weight:750;transition:.25s;pointer-events:none;max-width:min(550px,90vw);text-align:center}#toast.show{opacity:1;transform:translate(-50%,0)}.footnote{font-size:12px;color:var(--muted);line-height:1.7;margin-top:25px}.sprint-time{font-size:28px;color:var(--violet);font-weight:900}.mobile-nav{display:none}.keyboard-note{font-size:11px;color:var(--muted);margin-top:9px}.two-actions{display:flex;gap:10px;flex-wrap:wrap}.two-actions .btn{flex:1}.level-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.grid-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}

<body>

  <div id="toast" role="status" aria-live="polite"></div>
  <script>
/* Авторская программа A0–A1. Структура: [испанский, русский, примерное чтение].
   Чтение русскими буквами только подсказка, не замена реальному произношению. */
const COURSES = [
 {id:1,unit:1,title:'Звуки и первые слова',subtitle:'Как читать по-испански',emoji:'🔤',mins:10,level:'A0',
  theory:{intro:'В испанском буквы обычно читаются предсказуемо. Начни с пяти гласных: A — «а», E — «э», I — «и», O — «о», U — «у». Они почти не меняют звучание.',rule:'Буква H не читается: hola → «ола». J звучит примерно как русское «х»: jamón → «хамон». Ñ — отдельная буква со звуком «нь»: España → «эспанья». Две L часто произносятся как «й»: calle → «кайе».',example:'Hola. Me llamo Ana. — Привет. Меня зовут Ана.',pitfall:'Не произноси «h» в hola. Подсказки русскими буквами приблизительны — нажимай 🔊, чтобы услышать живой испанский синтезированный голос.'},
  words:[['hola','привет','о́ла'],['gracias','спасибо','гра́сьяс'],['por favor','пожалуйста','пор фаво́р'],['sí','да','си'],['no','нет','но'],['España','Испания','эспа́нья'],['calle','улица','ка́йе'],['jamón','хамон','хамо́н']],
  custom:[{type:'choice',q:'Как читается буква H в слове «hola»?',options:['Не произносится','Как русская «г»','Как русская «х»','Как русская «й»'],answer:0,why:'В испанском h — немая буква. Hola звучит примерно как «ола».'},{type:'choice',q:'Какой звук обозначает испанская буква Ñ?',options:['Нь','Ш','Ч','Ж'],answer:0,why:'Ñ — отдельная буква, звук похож на мягкое «нь»: España.'}]},
 {id:2,unit:1,title:'Приветствия и прощания',subtitle:'Заговорить с первого дня',emoji:'👋',mins:12,level:'A0',
  theory:{intro:'В испанском приветствие зависит от времени суток и ситуации. Hola — универсальное «привет». Buenos días — доброе утро / добрый день.',rule:'Buenas tardes говорят после полудня, buenas noches — вечером, ночью и перед сном. В Андалусии можно услышать просто «¡Buenas!» или «¡Buenos!» — это разговорное сокращение.',example:'— ¡Hola! ¿Qué tal? — Muy bien, gracias. ¿Y tú? — Привет! Как дела? — Очень хорошо, спасибо. А у тебя?',pitfall:'«Buenas» само по себе — обычное неформальное приветствие; не обязательно каждый раз говорить полное «Buenos días».'},
  words:[['buenos días','доброе утро / добрый день','буэ́нос ди́ас'],['buenas tardes','добрый день / вечер','буэ́нас та́рдэс'],['buenas noches','добрый вечер / спокойной ночи','буэ́нас но́чэс'],['qué tal','как дела','кэ таль'],['muy bien','очень хорошо','муй бьен'],['adiós','пока / до свидания','адьо́с'],['hasta luego','до скорого','а́ста луэ́го'],['buenas','привет (разговорное)','буэ́нас']],
  custom:[{type:'choice',q:'Вечером ты заходишь в магазин. Что уместно сказать?',options:['Buenas noches','Buenos días','Hasta luego','Por favor'],answer:0,why:'Buenas noches — приветствие вечером и пожелание спокойной ночи.'},{type:'text',q:'Как сказать «Как дела?» (без знаков вопроса)?',answers:['qué tal','que tal'],hint:'Два слова: «кэ таль».',why:'¿Qué tal? — «Как дела?». Вопрос оформляется двумя знаками: ¿ в начале и ? в конце.'}]},
 {id:3,unit:1,title:'Как представиться',subtitle:'Имя, знакомство, вежливость',emoji:'🧑‍🤝‍🧑',mins:12,level:'A0',
  theory:{intro:'Испанцы представляются с помощью «Me llamo...» (меня зовут...) или «Soy...» (я...).',rule:'¿Cómo te llamas? — «Как тебя зовут?»; Me llamo Maksim — «Меня зовут Максим»; Mucho gusto / Encantado(-a) — «Очень приятно».',example:'— Hola, me llamo Ana. ¿Cómo te llamas? — Soy Pablo. Mucho gusto.',pitfall:'По-испански нельзя строить имя дословно как «yo nombre ...». Используй «me llamo» или «soy».'},
  words:[['me llamo','меня зовут','мэ я́мо'],['cómo te llamas','как тебя зовут','ко́мо тэ я́мас'],['soy','я есть / я являюсь','сой'],['mucho gusto','очень приятно','му́чо гу́сто'],['encantado','очень приятно (муж.)','энканта́до'],['encantada','очень приятно (жен.)','энканта́да'],['y tú','а ты','и ту'],['de dónde eres','откуда ты','дэ до́ндэ э́рэс']],
  custom:[{type:'build',q:'Собери предложение «Меня зовут Ана».',tokens:['Me','llamo','Ana'],why:'Me llamo + имя — стандартный способ представиться.'},{type:'choice',q:'Тебя спрашивают «¿Cómo te llamas?». Что ответить?',options:['Me llamo Luis','Tengo veinte años','Hasta luego','Buenas noches'],answer:0,why:'Вопрос означает «Как тебя зовут?», поэтому логично назвать своё имя: Me llamo Luis.'}]},
 {id:4,unit:1,title:'Я, ты, он: SER',subtitle:'Самый важный глагол',emoji:'🧩',mins:15,level:'A0',
  theory:{intro:'SER — «быть» в значении личности, профессии, происхождения, постоянных характеристик. В русском часто говорим «я студент», в испанском нужен глагол: «Soy estudiante».',rule:'yo soy — я; tú eres — ты; él/ella es — он/она; nosotros somos — мы; vosotros sois — вы (Испания); ellos/ustedes son — они/вы. Местоимение часто опускают.',example:'Soy de Ucrania. Tú eres estudiante. Ella es española.',pitfall:'Не говори «yo es» или «tú soy». Каждому лицу своя форма: soy, eres, es.'},
  words:[['yo soy','я являюсь','йо сой'],['tú eres','ты являешься','ту э́рэс'],['él es','он является','эль эс'],['ella es','она является','э́йя эс'],['somos','мы являемся','со́мос'],['sois','вы являетесь (Испания)','со́йс'],['son','они являются','сон'],['estudiante','студент / студентка','эстудья́нтэ']],
  custom:[{type:'choice',q:'Дополни: «Yo ___ estudiante».',options:['soy','eres','es','son'],answer:0,why:'С yo (я) употребляется форма soy.'},{type:'choice',q:'Дополни: «Ella ___ española».',options:['es','soy','eres','somos'],answer:0,why:'С ella (она) форма SER — es.'},{type:'text',q:'Переведи «Мы студенты» (без точки).',answers:['somos estudiantes','nosotros somos estudiantes','nosotras somos estudiantes'],hint:'«Мы» — somos; студентЫ — estudiantes.',why:'Somos estudiantes — «Мы студенты». Можно добавить nosotros или nosotras.'}]},
 {id:5,unit:1,title:'Личные местоимения',subtitle:'Кто совершает действие?',emoji:'🎭',mins:11,level:'A0',
  theory:{intro:'Местоимения помогают понять, к кому относится действие. В испанском их часто опускают — форма глагола уже показывает лицо.',rule:'yo — я, tú — ты, él — он, ella — она, nosotros/nosotras — мы, vosotros/vosotras — вы (неформально, Испания), ellos/ellas — они, usted/ustedes — Вы/вы (вежливо).',example:'¿Eres de Málaga? — Sí, soy de Málaga. («Ты из Малаги?» — «Да, я из Малаги».)',pitfall:'Tú («ты») пишется с ударением. Tu («твой») без ударения — другое слово.'},
  words:[['yo','я','йо'],['tú','ты','ту'],['él','он','эль'],['ella','она','э́йя'],['nosotros','мы','носо́трос'],['vosotros','вы (неформ., Испания)','восо́трос'],['ellos','они','э́йос'],['usted','Вы (вежливо)','устэ́д']],custom:[]},
 {id:6,unit:1,title:'Числа от 0 до 20',subtitle:'Считаем и называем возраст',emoji:'🔢',mins:14,level:'A0',
  theory:{intro:'Числа нужны для цен, возраста, телефонов и заказов. Испанские 0–15 стоит запомнить как отдельные слова.',rule:'0 cero, 1 uno, 2 dos, 3 tres, 4 cuatro, 5 cinco, 6 seis, 7 siete, 8 ocho, 9 nueve, 10 diez; 11 once, 12 doce, 13 trece, 14 catorce, 15 quince; 16 dieciséis, 17 diecisiete, 18 dieciocho, 19 diecinueve, 20 veinte.',example:'Tengo veinte años. — Мне двадцать лет.',pitfall:'Для возраста испанцы используют TENER («иметь»): Tengo 20 años, а не Soy 20 años.'},
  words:[['cero','ноль','сэ́ро'],['uno','один','у́но'],['dos','два','дос'],['tres','три','трэс'],['cinco','пять','си́нко'],['diez','десять','дьес'],['doce','двенадцать','до́сэ'],['quince','пятнадцать','ки́нсэ'],['dieciséis','шестнадцать','дьесисэ́йс'],['veinte','двадцать','бэ́йнтэ']],
  custom:[{type:'choice',q:'Как по-испански 15?',options:['quince','cinco','dieciséis','doce'],answer:0,why:'15 — quince, а cinco — 5.'},{type:'text',q:'Напиши по-испански число «20».',answers:['veinte'],hint:'Начинается на v.',why:'20 — veinte.'}]},
 {id:7,unit:2,title:'У меня есть: TENER',subtitle:'Возраст, вещи и потребности',emoji:'🎒',mins:15,level:'A0',
  theory:{intro:'TENER = «иметь». С его помощью говорят об обладании, возрасте, голоде, жажде.',rule:'tengo — у меня есть; tienes — у тебя есть; tiene — у него/неё есть; tenemos — у нас есть; tenéis — у вас есть; tienen — у них есть.',example:'Tengo un perro. Tengo veinte años. ¿Tienes agua?',pitfall:'Испанский возраст — Tengo 25 años, не Soy 25 años. Для «я голоден» обычно говорят Tengo hambre.'},
  words:[['tengo','у меня есть','тэ́нго'],['tienes','у тебя есть','тье́нэс'],['tiene','у него/неё есть','тье́нэ'],['tenemos','у нас есть','тэнэ́мос'],['tenéis','у вас есть','тэнэ́йс'],['tienen','у них есть','тье́нэн'],['tengo hambre','я голоден','тэ́нго а́мбрэ'],['tengo sed','я хочу пить','тэ́нго сэд']],
  custom:[{type:'choice',q:'Как сказать «Мне 20 лет»?',options:['Tengo veinte años','Soy veinte años','Es veinte años','Tienes veinte años'],answer:0,why:'О возрасте говорят с tener: Tengo veinte años.'},{type:'choice',q:'«¿Tú ___ un perro?»',options:['tienes','tengo','tiene','tenemos'],answer:0,why:'Для tú нужна форма tienes.'}]},
 {id:8,unit:2,title:'Откуда ты?',subtitle:'Страны и национальности',emoji:'🌍',mins:12,level:'A0',
  theory:{intro:'Чтобы сказать, откуда ты, используй «Soy de + город / страна».',rule:'С национальностью после ser часто нет артикля: Soy español; Soy ucraniana. Обычно национальность меняется по роду: español/española; ruso/rusa.',example:'— ¿De dónde eres? — Soy de Ucrania. Vivo en España.',pitfall:'«Soy de España» (я из Испании) и «Vivo en España» (я живу в Испании) — разные значения.'},
  words:[['soy de','я из','сой дэ'],['vivo en','я живу в','би́во эн'],['España','Испания','эспа́нья'],['Ucrania','Украина','укра́нья'],['Rusia','Россия','ру́сья'],['Málaga','Малага','ма́лага'],['español','испанец / испанский','эспаньо́ль'],['española','испанка / испанская','эспаньо́ла'],['ruso','русский (муж.)','ру́со'],['ucraniana','украинка','украниа́на']],custom:[]},
 {id:9,unit:2,title:'El, la, un, una',subtitle:'Род и артикли без путаницы',emoji:'📦',mins:15,level:'A0',
  theory:{intro:'У существительных есть грамматический род. Перед ними часто стоит артикль.',rule:'el — определённый мужской («этот/тот»), la — определённый женский; un — неопределённый мужской («какой-то/один»), una — женский. Множественное: los/las, unos/unas.',example:'el libro — книга; la casa — дом; un coche — машина; una mesa — стол.',pitfall:'Не всегда «-a» означает женский род, а «-o» — мужской: el día, la mano. Запоминай слово вместе с артиклем.'},
  words:[['el libro','книга','эль ли́бро'],['la casa','дом','ла ка́са'],['un coche','машина','ун ко́чэ'],['una mesa','стол','у́на мэ́са'],['el agua','вода (с артиклем el)','эль а́гуа'],['la ciudad','город','ла сьюда́д'],['los libros','книги','лос ли́брос'],['las casas','дома','лас ка́сас']],
  custom:[{type:'choice',q:'Выбери правильный вариант «одна книга».',options:['un libro','una libro','el libros','la libro'],answer:0,why:'Libro — существительное мужского рода: un libro.'},{type:'choice',q:'Как правильно сказать «этот дом» (определённый артикль)?',options:['la casa','el casa','un casa','los casa'],answer:0,why:'Casa — женского рода, поэтому la casa.'}]},
 {id:10,unit:2,title:'Один и много',subtitle:'Множественное число',emoji:'🧺',mins:12,level:'A0',
  theory:{intro:'Обычно, если существительное заканчивается на гласную, для множественного числа добавляем -s.',rule:'casa → casas; libro → libros. Если слово заканчивается на согласную, чаще -es: ciudad → ciudades; profesor → profesores. Артикль тоже меняется: el → los, la → las.',example:'Una casa → dos casas. El profesor → los profesores.',pitfall:'Не забывай изменять артикль вместе с существительным: las casas, а не la casas.'},
  words:[['casa','дом','ка́са'],['casas','дома','ка́сас'],['libro','книга','ли́бро'],['libros','книги','ли́брос'],['profesor','учитель','профэсо́р'],['profesores','учителя','профэсо́рэс'],['ciudad','город','сьюда́д'],['ciudades','города','сьюда́дэс']],custom:[]},
 {id:11,unit:2,title:'Моя семья',subtitle:'Рассказываем о близких',emoji:'🏠',mins:12,level:'A0',
  theory:{intro:'Слова о семье пригодятся в знакомстве и простых разговорах.',rule:'mi — мой/моя, mis — мои. «Mi hermana» — моя сестра; «Mis padres» — мои родители. Перед обычным существительным используется mi, не mío.',example:'Mi madre vive en Málaga. Tengo un hermano.',pitfall:'Padres обычно означает «родители», а не только «отцы». «Mis padres» — мои родители.'},
  words:[['mi madre','моя мама','ми ма́дрэ'],['mi padre','мой папа','ми па́дрэ'],['mi hermano','мой брат','ми эрма́но'],['mi hermana','моя сестра','ми эрма́на'],['mis padres','мои родители','мис па́дрэс'],['mi pareja','мой партнёр / моя пара','ми парэ́ха'],['mi amigo','мой друг','ми ами́го'],['mi amiga','моя подруга','ми ами́га']],custom:[]},
 {id:12,unit:2,title:'Глаголы на -AR',subtitle:'Говорить, работать, учиться',emoji:'✍️',mins:16,level:'A1',
  theory:{intro:'Многие испанские глаголы в начальной форме заканчиваются на -ar, например hablar (говорить).',rule:'Отбрось -ar и прибавь окончание: yo hablo, tú hablas, él habla, nosotros hablamos, vosotros habláis, ellos hablan. Так же: trabajar → trabajo, estudiar → estudio.',example:'Hablo español. Trabajo en Málaga. Ella estudia inglés.',pitfall:'После yo нельзя оставить инфинитив «yo hablar». Нужна личная форма «yo hablo».'},
  words:[['hablar','говорить','абла́р'],['hablo','я говорю','а́бло'],['hablas','ты говоришь','а́блас'],['habla','он/она говорит','а́бла'],['trabajar','работать','трабаxа́р'],['trabajo','я работаю','траба́хо'],['estudiar','учиться / изучать','эстудья́р'],['estudio','я учусь','эсту́дьо']],
  custom:[{type:'choice',q:'«Yo ___ español».',options:['hablo','hablas','hablar','hablan'],answer:0,why:'Форма yo от hablar — hablo.'},{type:'choice',q:'«Ella ___ en Madrid». (работает)',options:['trabaja','trabajo','trabajar','trabajas'],answer:0,why:'Ella → trabaja, окончание -a.'}]},
 {id:13,unit:3,title:'Глаголы на -ER и -IR',subtitle:'Есть, пить, жить, писать',emoji:'📝',mins:16,level:'A1',
  theory:{intro:'Есть ещё два больших типа глаголов: -er (comer) и -ir (vivir).',rule:'COMER: como, comes, come, comemos, coméis, comen. VIVIR: vivo, vives, vive, vivimos, vivís, viven. Формы похожи, но различаются у nosotros и vosotros.',example:'Como arroz. Vivo en Benalmádena. Ella escribe mucho.',pitfall:'«Yo como» = я ем; «cómo» с ударением — «как?»; это разные слова.'},
  words:[['comer','есть (пищу)','комэ́р'],['como','я ем','ко́мо'],['comes','ты ешь','ко́мэс'],['beber','пить','бэбэ́р'],['bebo','я пью','бэ́бо'],['vivir','жить','биби́р'],['vivo','я живу','би́во'],['escribir','писать','эскриби́р']],
  custom:[{type:'choice',q:'«Nosotros ___ en España». (живём)',options:['vivimos','vivemos','viven','vives'],answer:0,why:'У vivir с nosotros окончание -imos: vivimos.'},{type:'text',q:'Напиши «Я ем» по-испански.',answers:['como','yo como'],hint:'Форма от comer для yo заканчивается на -o.',why:'Yo como или просто Como — «Я ем».'}]},
 {id:14,unit:3,title:'Еда и напитки',subtitle:'Покупки, меню, продукты',emoji:'🥑',mins:12,level:'A1',
  theory:{intro:'Слова о еде пригодятся каждый день в супермаркете, кафе и ресторане.',rule:'Quiero agua — я хочу воду. Para mí, un café — мне кофе. Sin cebolla — без лука. Con hielo — со льдом. «Un poco de» означает «немного».',example:'Quiero pollo con arroz y agua sin gas, por favor.',pitfall:'«Sin» означает «без», «con» — «с». Очень полезно для заказа еды с ограничениями.'},
  words:[['agua','вода','а́гуа'],['pan','хлеб','пан'],['arroz','рис','арро́с'],['pollo','курица','по́йо'],['pescado','рыба (как продукт)','пэска́до'],['patata','картофель','пата́та'],['sin cebolla','без лука','син сэбо́йя'],['con queso','с сыром','кон кэ́со'],['leche','молоко','ле́чэ'],['café','кофе','кафэ́']],custom:[]},
 {id:15,unit:3,title:'Цены и покупки',subtitle:'Спросить цену и размер',emoji:'🛍️',mins:13,level:'A1',
  theory:{intro:'В магазине важно уметь спросить цену, размер и возможность оплаты картой.',rule:'¿Cuánto cuesta? — Сколько стоит? ¿Cuánto cuestan? — Сколько стоят (несколько вещей)? ¿Tienes otra talla? — Есть другой размер?',example:'— ¿Cuánto cuesta esta camiseta? — Veinte euros. — ¿Puedo pagar con tarjeta?',pitfall:'Cuesta — для одной вещи; cuestan — для нескольких. «Caro» — дорогой, «barato» — дешёвый.'},
  words:[['cuánto cuesta','сколько стоит','куа́нто куэ́ста'],['cuánto cuestan','сколько стоят','куа́нто куэ́стан'],['barato','дешёвый','бара́то'],['caro','дорогой','ка́ро'],['talla','размер одежды','та́йя'],['precio','цена','прэ́сьо'],['tarjeta','банковская карта','тархэ́та'],['efectivo','наличные','эфэкти́во'],['rebaja','скидка / распродажа','рэба́ха']],custom:[]},
 {id:16,unit:3,title:'Дни недели и время',subtitle:'Договориться о встрече',emoji:'🗓️',mins:14,level:'A1',
  theory:{intro:'Названия дней недели пишут с маленькой буквы. Их полезно сразу учить с выражениями времени.',rule:'lunes, martes, miércoles, jueves, viernes, sábado, domingo. Hoy — сегодня, mañana — завтра / утро (по контексту), ayer — вчера. «A las tres» — в три часа.',example:'Nos vemos el viernes a las cinco. — Увидимся в пятницу в пять.',pitfall:'Mañana бывает и «завтра», и «утро». «Por la mañana» однозначно означает «утром».'},
  words:[['lunes','понедельник','лу́нэс'],['martes','вторник','ма́ртэс'],['miércoles','среда','мье́рколэс'],['jueves','четверг','хуэ́вэс'],['viernes','пятница','бье́рнэс'],['sábado','суббота','са́бадо'],['domingo','воскресенье','доми́нго'],['hoy','сегодня','ой'],['mañana','завтра / утро','манья́на'],['ayer','вчера','айэ́р']],custom:[]},
 {id:17,unit:3,title:'Где находится?',subtitle:'Город и направления',emoji:'🧭',mins:14,level:'A1',
  theory:{intro:'На улице и в городе часто спрашивают, где находится нужное место.',rule:'¿Dónde está ...? — Где находится ...? Cerca — близко; lejos — далеко; a la derecha — справа; a la izquierda — слева; todo recto — прямо.',example:'¿Dónde está la estación? Está cerca, a la derecha.',pitfall:'«Derecha» — право, «izquierda» — лево. Проговори их вслух несколько раз с кнопкой 🔊.'},
  words:[['dónde está','где находится','до́ндэ эста́'],['estación','станция','эстасьо́н'],['supermercado','супермаркет','супэрмэрка́до'],['farmacia','аптека','фарма́сья'],['a la derecha','направо / справа','а ла дэрэ́ча'],['a la izquierda','налево / слева','а ла искье́рда'],['todo recto','прямо','то́до рэ́кто'],['cerca','близко','сэ́рка'],['lejos','далеко','ле́хос']],custom:[]},
 {id:18,unit:3,title:'ESTAR: где и как',subtitle:'Местоположение и состояние',emoji:'📍',mins:17,level:'A1',
  theory:{intro:'SER описывает, кем или чем является объект. ESTAR обычно описывает местоположение и текущее состояние.',rule:'estoy — я; estás — ты; está — он/она; estamos — мы; estáis — вы; están — они. «Estoy en casa» — я дома; «Estoy cansado» — я устал.',example:'Soy estudiante (кто я). Estoy en casa (где я). Estoy bien (как я).',pitfall:'Говорим «Estoy en Málaga» (я нахожусь в Малаге), а не «Soy en Málaga».',extra:'SER vs ESTAR: «Soy de Málaga» — я родом из Малаги; «Estoy en Málaga» — я сейчас в Малаге.'},
  words:[['estoy','я нахожусь / чувствую себя','эсто́й'],['estás','ты находишься','эста́с'],['está','он/она находится','эста́'],['estamos','мы находимся','эста́мос'],['están','они находятся','эста́н'],['estoy bien','я в порядке','эсто́й бьен'],['estoy cansado','я устал','эсто́й канса́до'],['en casa','дома','эн ка́са']],
  custom:[{type:'choice',q:'«Ahora ___ en casa». (Сейчас я дома)',options:['estoy','soy','eres','somos'],answer:0,why:'Где я нахожусь сейчас → estar: estoy en casa.'},{type:'choice',q:'«Ella ___ médica». (Она врач)',options:['es','está','estoy','están'],answer:0,why:'Профессия → ser: ella es médica.'}]},
 {id:19,unit:4,title:'HAY: здесь есть...',subtitle:'Описываем существование',emoji:'🏙️',mins:13,level:'A1',
  theory:{intro:'HAY — «есть / имеется» в месте. Форма одна и для единственного, и для множественного числа.',rule:'Hay una farmacia aquí. — Здесь есть аптека. Hay dos restaurantes. — Есть два ресторана. No hay — нет. ¿Hay...? — Есть ли...?',example:'¿Hay un supermercado cerca? — Sí, hay uno a la derecha.',pitfall:'Для «в городе есть парк» говори «Hay un parque», а не «Está un parque». «Está» — о местонахождении уже известного парка.'},
  words:[['hay','есть / имеется','ай'],['no hay','нет / не имеется','но ай'],['aquí','здесь','аки́'],['allí','там','айи́'],['un parque','парк','ун па́ркэ'],['una tienda','магазин','у́на тье́нда'],['un banco','банк','ун ба́нко'],['una playa','пляж','у́на пла́йя']],custom:[]},
 {id:20,unit:4,title:'Цвета и одежда',subtitle:'Внешний вид и гардероб',emoji:'👕',mins:12,level:'A1',
  theory:{intro:'Цвет обычно ставится после существительного: camiseta blanca (белая футболка).',rule:'Часть цветов согласуется по роду и числу: rojo/roja/rojos/rojas; blanco/blanca. Некоторые не меняются по роду: verde, azul.',example:'Quiero una camisa negra y unos zapatos blancos.',pitfall:'Не говори «rojo camiseta» как кальку с русского: camiseta roja.'},
  words:[['rojo','красный','ро́хо'],['azul','синий / голубой','асу́ль'],['verde','зелёный','бэ́рдэ'],['blanco','белый','бла́нко'],['negro','чёрный','нэ́гро'],['camiseta','футболка','камисэ́та'],['pantalones','брюки','пантало́нэс'],['zapatos','обувь / туфли','сапа́тос'],['camisa','рубашка','ками́са']],custom:[]},
 {id:21,unit:4,title:'Прилагательные',subtitle:'Большой, маленький, новый',emoji:'🌈',mins:13,level:'A1',
  theory:{intro:'Прилагательное описывает существительное и часто стоит после него.',rule:'Grande — большой, pequeño/pequeña — маленький/маленькая, nuevo/nueva — новый/новая. Согласуй прилагательное по роду и числу: coches nuevos, casas pequeñas.',example:'Una casa grande. Dos coches pequeños. Una mochila nueva.',pitfall:'Если существительное женского рода, обычно нужно -a: casa pequeña, не casa pequeño.'},
  words:[['grande','большой','гра́ндэ'],['pequeño','маленький','пэкэ́ньо'],['nuevo','новый','нуэ́во'],['viejo','старый','бье́хо'],['bonito','красивый','бони́то'],['difícil','трудный','дифи́силь'],['fácil','лёгкий','фа́силь'],['rápido','быстрый','ра́пидо']],custom:[]},
 {id:22,unit:4,title:'QUERER и PODER',subtitle:'Хочу и могу',emoji:'💪',mins:16,level:'A1',
  theory:{intro:'Два суперполезных глагола: querer — хотеть; poder — мочь, иметь возможность.',rule:'Querer: quiero, quieres, quiere, queremos, queréis, quieren. Poder: puedo, puedes, puede, podemos, podéis, pueden. После них обычно инфинитив: Quiero comer; Puedo hablar.',example:'Quiero un café. ¿Puedo pagar con tarjeta? ¿Quieres venir?',pitfall:'После quiero/puedo следующий глагол остаётся в инфинитиве: «Quiero comprar», не «Quiero compro».'},
  words:[['quiero','я хочу','кье́ро'],['quieres','ты хочешь','кье́рэс'],['quiere','он/она хочет','кье́рэ'],['puedo','я могу','пуэ́до'],['puedes','ты можешь','пуэ́дэс'],['puede','он/она может','пуэ́дэ'],['comprar','купить / покупать','компра́р'],['venir','приходить','бэни́р']],custom:[]},
 {id:23,unit:4,title:'Заказываем в кафе',subtitle:'Реальные фразы для Испании',emoji:'☕',mins:14,level:'A1',
  theory:{intro:'В кафе можно вежливо и просто попросить нужное с помощью «Quería...» (я бы хотел) или «Quiero...» (я хочу).',rule:'Para mí — мне; para llevar — с собой; aquí — здесь; la cuenta — счёт; sin azúcar — без сахара; con leche — с молоком.',example:'Hola, quería un café con leche para llevar, por favor. ¿Cuánto es?',pitfall:'«La cuenta, por favor» — естественный способ попросить счёт. Не путай «cuenta» (счёт) и «cuento» (рассказ).'},
  words:[['quería','я бы хотел(а)','кэри́а'],['para llevar','с собой','па́ра йэва́р'],['para mí','для меня / мне','па́ра ми'],['la cuenta','счёт','ла куэ́нта'],['sin azúcar','без сахара','син асу́кар'],['con leche','с молоком','кон ле́чэ'],['un vaso','стакан','ун ба́со'],['una botella','бутылка','у́на ботэ́йя']],custom:[]},
 {id:24,unit:4,title:'Рутина и работа',subtitle:'Мой обычный день',emoji:'💼',mins:13,level:'A1',
  theory:{intro:'Рассказывай о привычках с помощью настоящего времени и простых связок.',rule:'Siempre — всегда, a veces — иногда, normalmente — обычно, nunca — никогда. «Trabajo de lunes a viernes» — работаю с понедельника по пятницу.',example:'Normalmente trabajo por la mañana y estudio español por la tarde.',pitfall:'В Испании «autónomo» — самозанятый предприниматель. «Soy autónomo» — я autónomo.'},
  words:[['trabajo','я работаю / работа','траба́хо'],['descanso','я отдыхаю','дэска́нсо'],['siempre','всегда','сье́мпрэ'],['nunca','никогда','ну́нка'],['a veces','иногда','а бэ́сэс'],['normalmente','обычно','нормальме́нтэ'],['por la mañana','утром','пор ла манья́на'],['por la tarde','днём / вечером','пор ла та́рдэ']],custom:[]},
 {id:25,unit:5,title:'Вопросительные слова',subtitle:'Что, где, когда и почему',emoji:'❓',mins:14,level:'A1',
  theory:{intro:'Вопросительные слова легко узнать по знаку ударения и начальному перевёрнутому знаку вопроса.',rule:'qué — что, quién — кто, dónde — где, cuándo — когда, cómo — как, por qué — почему, cuánto — сколько, cuál — какой / который (по контексту).',example:'¿Dónde vives? — En Málaga. ¿Por qué estudias español? — Porque vivo en España.',pitfall:'«Por qué» (почему?) пишется раздельно, «porque» (потому что) — слитно.'},
  words:[['qué','что','кэ'],['quién','кто','кье́н'],['dónde','где','до́ндэ'],['cuándo','когда','куа́ндо'],['cómo','как','ко́мо'],['por qué','почему','пор кэ'],['cuánto','сколько','куа́нто'],['cuál','какой / который','куа́ль']],custom:[]},
 {id:26,unit:5,title:'Диалог в ресторане',subtitle:'Меню, счёт и просьбы',emoji:'🍽️',mins:15,level:'A1',

  <script>
'use strict';
const KEY='vamos-es-2026-v1';
const blankState=()=>({xp:0,streak:0,lastActive:'',finished:{},wordStats:{},history:[],activity:{},goal:20,soundRate:.87,theme:'light'});
function loadState(){try{const raw=JSON.parse(localStorage.getItem(KEY)||'null');return raw&&typeof raw==='object'?{...blankState(),...raw,finished:raw.finished||{},wordStats:raw.wordStats||{},history:Array.isArray(raw.history)?raw.history:[],activity:raw.activity||{}}:blankState()}catch{return blankState()}}
let db=loadState();
let page='home',activeLesson=1,session=null,cardSession=null,matchSession=null,dialogSession=null,pronounceIndex=0,quizFilter='all',wordFilter='all',wordSearch='',selectedUnit='all',helperQuery='',helperAnswer='',faqOpen=null;
let toastTimer=null;
const app=document.getElementById('app');
const html=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=v=>String(v??'').toLocaleLowerCase('es').trim().replaceAll('ñ','__enye__').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replaceAll('__enye__','ñ').replace(/[¿?¡!.,;:()"“”‘’]/g,'').replace(/\s+/g,' ');
const escAttr=html;
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const plusDays=(date,n)=>{let d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const dateDiff=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
const lessonById=id=>COURSES.find(x=>x.id===Number(id))||COURSES[0];
const currentLesson=()=>COURSES.find(c=>!db.finished[c.id])||COURSES[COURSES.length-1];
const totalWords=()=>new Set(COURSES.flatMap(c=>c.words.map(w=>norm(w[0])))).size;
const wordsAll=()=>{const set=new Set();return COURSES.flatMap(l=>l.words.map(w=>({...{es:w[0],ru:w[1],pron:w[2]},unit:l.unit,lesson:l.id,key:norm(w[0])}))).filter(w=>{if(set.has(w.key))return false;set.add(w.key);return true;})};
const wordKey=w=>norm(Array.isArray(w)?w[0]:w.es);
const wordsKnown=()=>Object.values(db.wordStats).filter(x=>x.seen).length;
const dueWords=()=>wordsAll().filter(w=>db.wordStats[w.key]?.seen&&db.wordStats[w.key].due<=today());
const weakWords=()=>wordsAll().filter(w=>db.wordStats[w.key]?.wrong>0);
const countDone=()=>Object.keys(db.finished).filter(k=>db.finished[k]).length;
const dailyXp=()=>db.activity[today()]?.xp||0;
const dailySessions=()=>db.history.filter(h=>h.date===today());
const passed=x=>x?'<span class="chip green">✓ Завершено</span>':'<span class="chip">В процессе</span>';
const shuffle=a=>{let arr=[...a];for(let i=arr.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr};
const randomSample=(arr,n)=>shuffle(arr).slice(0,n);
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch{toast('Не удалось сохранить прогресс. Проверь настройки браузера.')}}
function toast(s){const el=document.getElementById('toast');el.textContent=s;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3000)}
function tickStreak(){const day=today();if(db.lastActive===day)return;if(!db.lastActive){db.streak=1}else{db.streak=dateDiff(db.lastActive,day)===1?db.streak+1:1}db.lastActive=day}
function addXp(n){tickStreak();db.xp+=n;db.activity[today()]??={xp:0};db.activity[today()].xp+=n;save()}
function logSession(type,title,score,earned){db.history.unshift({type,title,score,xp:earned,date:today(),at:Date.now()});db.history=db.history.slice(0,90);save()}
function wordResult(w,correct){if(!w)return;const key=wordKey(w);let st=db.wordStats[key]||{seen:0,wrong:0,level:0,due:today()};st.seen++;if(!correct){st.wrong++;st.level=Math.max(0,st.level-1);st.due=today()}else{st.level=Math.min(5,st.level+1);st.due=plusDays(today(),[0,1,3,7,14,30][st.level])}db.wordStats[key]=st;save()}
function spoken(text,rate){if(!('speechSynthesis'in window)){toast('Этот браузер не поддерживает озвучку.');return}try{speechSynthesis.cancel();let utter=new SpeechSynthesisUtterance(text);utter.lang='es-ES';utter.rate=rate||db.soundRate||.87;utter.pitch=1;const vs=speechSynthesis.getVoices();const spanish=vs.find(v=>/^es-ES/i.test(v.lang))||vs.find(v=>/^es/i.test(v.lang));if(spanish)utter.voice=spanish;speechSynthesis.speak(utter)}catch{toast('Не удалось включить озвучку на этом устройстве.')}}
const dayPhrases=[['¡Poco a poco!','Шаг за шагом!'],['¡Muy bien!','Очень хорошо!'],['¿Qué tal?','Как дела?'],['¡Hasta luego!','До скорого!'],['¡Claro que sí!','Конечно же!'],['¡Vamos!','Вперёд!'],['¡Qué bien!','Как здорово!']];
const phrase=()=>dayPhrases[Math.floor(Date.now()/864e5)%dayPhrases.length];

Attr(w[0])}" aria-label="Произнести ${escAttr(w[0])}">🔊</button></div>`).join('')}</div><button class="btn btn-light btn-block" style="margin-top:18px" data-action="pronounce-lesson" data-id="${l.id}">🎙️ Тренировать произношение</button></aside></div>`}
function allDistractors(l,target,property){const own=l.words.map(w=>w[property]).filter(t=>norm(t)!==norm(target));const all=COURSES.flatMap(c=>c.words.map(w=>w[property])).filter(t=>norm(t)!==norm(target));return [...new Set([...shuffle(own),...shuffle(all)])].filter(Boolean).slice(0,3)}
function makeExercises(l,mode='lesson'){
 let w=shuffle(l.words.map((w,i)=>({es:w[0],ru:w[1],pron:w[2],index:i,key:norm(w[0])})));
 let ex=[];
 const choices=(word,kind)=>{let isES=kind==='es'||kind==='listen',answer=isES?word.es:word.ru,distractors=allDistractors(l,answer,isES?0:1);let opts=shuffle([answer,...distractors]);return {kind,word,q:kind==='es'?`Как по-испански «${word.ru}»?`:kind==='ru'?`Что означает «${word.es}»?`:'Прослушай фразу. Что ты слышишь?',options:opts,answer:opts.findIndex(x=>norm(x)===norm(answer)),why:`${word.es} — «${word.ru}». ${word.pron?'Примерное чтение: '+word.pron+'.':''}`}};
 // Choose 8 practice items plus curated contextual grammar exercises.
 if(mode==='lesson'){
  ex.push(choices(w[0],'ru'),choices(w[1]||w[0],'es'),choices(w[2]||w[0],'listen'));
  let c=(l.custom||[]).map(x=>x.type==='choice'?{kind:'customChoice',q:x.q,options:x.options,answer:x.answer,why:x.why}:x.type==='text'?{kind:'customText',q:x.q,answers:x.answers,why:x.why,hint:x.hint}:x.type==='build'?{kind:'build',q:x.q,tokens:x.tokens,pool:shuffle(x.tokens.map((_,i)=>i)),answer:x.tokens.join(' '),why:x.why}:null).filter(Boolean);
  if(c.length){ex.push(c[0]);if(c[1])ex.push(c[1]);}
  ex.push(choices(w[3]||w[0],'es'),{kind:'input',word:w[4]||w[1],q:`Напиши по-испански: «${(w[4]||w[1]).ru}».`,answers:[(w[4]||w[1]).es],why:`Правильный вариант: ${(w[4]||w[1]).es}.`,hint:`В слове ${(w[4]||w[1]).es.trim().split(' ').length} слов(а).`},choices(w[5]||w[2],'listen'),choices(w[6]||w[3],'ru'));
  if(c[2])ex.push(c[2]); else ex.push({kind:'input',word:w[7]||w[0],q:`Напиши по-испански: «${(w[7]||w[0]).ru}».`,answers:[(w[7]||w[0]).es],why:`Правильный вариант: ${(w[7]||w[0]).es}.`,hint:`Начни с буквы «${(w[7]||w[0]).es[0]}».`});
 }else if(mode==='listen'){
  for(let i=0;i<Math.min(12,w.length);i++)ex.push(choices(w[i],'listen'));
 }else if(mode==='sprint'){
  for(let i=0;i<Math.min(12,w.length);i++)ex.push(choices(w[i],i%2?'ru':'es'));
 }else if(mode==='test'){
  let c=(l.custom||[]).filter(x=>x.type==='choice').map(x=>({kind:'customChoice',q:x.q,options:x.options,answer:x.answer,why:x.why}));
  ex.push(...c,choices(w[0],'ru'),choices(w[1],'es'),choices(w[2],'listen'),{kind:'input',word:w[3],q:`Переведи на испанский: «${w[3].ru}».`,answers:[w[3].es],why:`Правильный вариант: ${w[3].es}.`});
 }
 return ex;
}
function startLesson(id){activeLesson=Number(id);session={type:'lesson',lesson:activeLesson,ex:makeExercises(lessonById(activeLesson)),index:0,locked:false,answer:null,correct:0,wrong:0,xp:0,selected:[],hint:false,wrongItems:[],started:Date.now()};go('exercise')}
function startGame(mode,id){activeLesson=Number(id||currentLesson().id);let l=lessonById(activeLesson);if(mode==='match'){let ws=randomSample(l.words,4);matchSession={lesson:activeLesson,tiles:shuffle(ws.flatMap((w,i)=>[{id:i,side:'es',text:w[0],word:w},{id:i,side:'ru',text:w[1],word:w}])),chosen:null,matched:[],mistakes:0,xp:0};go('match');return}
 if(mode==='cards'){startCards();return}
 if(mode==='dialog'){dialogSession={story:0,turn:0,locked:false,answer:null,correct:0,xp:0};go('dialog');return}
 session={type:mode,lesson:activeLesson,ex:makeExercises(l,mode),index:0,locked:false,answer:null,correct:0,wrong:0,xp:0,selected:[],hint:false,wrongItems:[]};go('exercise')}
function currentEx(){return session?.ex[session.index]}
function checkAnswer(value){if(!session||session.locked)return;const q=currentEx();let correct=false;
 if(['ru','es','listen','customChoice'].includes(q.kind))correct=Number(value)===q.answer;
 else if(['input','customText'].includes(q.kind))correct=(q.answers||[]).some(ans=>norm(ans)===norm(value));
 else if(q.kind==='build')correct=norm(session.selected.map(x=>x.text).join(' '))===norm(q.answer);
 session.locked=true;session.answer={value,correct};correct?session.correct++:session.wrong++;
 if(!correct)session.wrongItems.push({question:q.q,answer:q.kind==='build'?q.answer:q.kind==='input'||q.kind==='customText'?q.answers[0]:q.options[q.answer],why:q.why});
 if(q.word)wordResult(q.word,correct);
 const earned=correct?10:2;session.xp+=earned;addXp(earned);render();
}
function moveNext(){if(!session)return;session.index++;session.locked=false;session.answer=null;session.selected=[];session.hint=false;if(session.index>=session.ex.length){finishSession()}else render()}
function finishSession(){if(!session)return;const l=lessonById(session.lesson),pct=Math.round(session.correct/session.ex.length*100);if(session.type==='lesson'&&pct>=60)db.finished[l.id]=true;let label=session.type==='lesson'?l.title:session.type==='listen'?'Аудиотренировка':session.type==='sprint'?'Спринт':'Контрольный тест';logSession(session.type,label,pct,session.xp);save();go('results')}
function qExplanation(q){return q.why||'Прочитай объяснение урока и попробуй снова.'}
function uiExercise(){if(!session){return `<div class="empty-state">Нет активного упражнения. <button class="btn btn-primary" data-action="nav" data-page="lessons">К урокам</button></div>`}

 let options='';if(['ru','es','listen','customChoice'].includes(q.kind))options=`<div class="answer-grid">${q.options.map((o,i)=>`<button class="answer-option ${locked&&i===q.answer?'correct':''} ${locked&&Number(ans.value)===i&&!ans.correct?'incorrect':''}" ${locked?'disabled':''} data-action="answer" data-answer="${i}"><span class="letter">${String.fromCharCode(65+i)}</span>${html(o)}</button>`).join('')}</div>`;
 else if(['input','customText'].includes(q.kind))options=`<form id="text-answer-form"><input id="text-answer" class="answer-field ${locked?(ans.correct?'ok':'bad'):''}" aria-label="Ответ на испанском" placeholder="Напиши ответ на испанском…" value="${locked?escAttr(ans.value):''}" ${locked?'disabled':'autocomplete="off" autocapitalize="none" spellcheck="false"'} /><div class="keyboard-note">Не переживай из-за значков ударения: á, é, í, ó, ú при проверке не обязательны. Важна сама форма слова.</div>${!locked?'<button class="btn btn-primary btn-block" style="margin-top:18px" type="submit">Проверить ответ →</button>':''}</form>`;
 else if(q.kind==='build'){let remaining=(q.pool||q.tokens.map((_,i)=>i)).map(i=>({text:q.tokens[i],id:i})).filter(x=>!session.selected.some(y=>y.id===x.id));options=`<p class="helper">Нажимай слова в нужном порядке. Чтобы убрать слово из ответа, нажми на него.</p><div class="token-answer">${session.selected.length?session.selected.map((v,i)=>`<button class="word-token" data-action="remove-token" data-index="${i}" ${locked?'disabled':''}>${html(v.text)} ×</button>`).join(''):'<small>Твоя фраза появится здесь</small>'}</div><div class="token-pool">${remaining.map(v=>`<button class="word-token" data-action="add-token" data-index="${v.id}" ${locked?'disabled':''}>${html(v.text)}</button>`).join('')}</div>${!locked?'<button class="btn btn-primary btn-block" data-action="check-build" '+(!session.selected.length?'disabled':'')+'>Проверить фразу →</button>':''}`}

function uiMatch(){if(!matchSession)return '<p>Нет активной игры.</p>';let m=matchSession,done=m.matched.length;if(done===4)return `<section class="complete"><div class="end-badge">🧩</div><h1>Все пары собраны!</h1><div class="score">4 / 4</div><p class="detail">Ошибочных попыток: ${m.mistakes} · +${m.xp} XP. Хорошая тренировка памяти!</p><div class="complete-actions"><button class="btn btn-primary" data-action="start-game" data-mode="match">Ещё раунд</button><button class="btn btn-outline" data-action="nav" data-page="games">К играм</button></div></section>`;return `<section class="center-wrap"><div class="page-head"><button class="btn btn-quiet btn-small" data-action="nav" data-page="games">← Все игры</button><h1 style="margin-top:15px">🧩 Найди пары</h1><p>Выбери слово на испанском, затем его русский перевод (или наоборот). Зелёные пары уже угаданы.</p></div><div class="white-card"><div class="progress-row"><strong>Найдено ${done} из 4 пар</strong><span class="chip">Ошибок: ${m.mistakes}</span></div><div class="progress-track" style="margin-top:15px"><div class="progress-fill green" style="width:${done/4*100}%"></div></div><div class="match-grid">${m.tiles.map((t,i)=>`<button class="match-item ${m.chosen===i?'active':''} ${m.matched.includes(t.id)?'matched':''}" data-action="match-tile" data-index="${i}" ${m.matched.includes(t.id)?'disabled':''}>${html(t.text)}</button>`).join('')}</div><p class="helper">Подсказка: после совпадения нажми 🔊 в словаре, чтобы закрепить произношение.</p></div></section>`}

function micCheck(expected){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('В этом браузере распознавание речи недоступно. Слушай слово и повторяй самостоятельно.');return}const output=document.getElementById('mic-feedback');if(output)output.innerHTML='<div class="mic-status">🎤 Слушаю… произнеси фразу вслух</div>';
 try{speechSynthesis?.cancel();const r=new SR();r.lang='es-ES';r.interimResults=false;r.maxAlternatives=3;r.onresult=e=>{let words=[...e.results[0]].map(x=>x.transcript),hit=words.some(x=>norm(x)===norm(expected));const text=words[0]||'';if(output)output.innerHTML=`<div class="mic-result" style="background:${hit?'var(--mint-bg)':'var(--amber-bg)'}"><strong>${hit?'✓ Браузер распознал фразу!':'Попробуй ещё раз'}</strong><p style="margin:5px 0 0;font-size:13px">Услышано: «${html(text)}». Ожидалось: «${html(expected)}».</p></div>`;if(hit)addXp(3)};r.onerror=e=>{if(output)output.innerHTML=`<div class="mic-status">Не удалось распознать речь (${html(e.error)}). Проверь доступ к микрофону.</div>`};r.onnomatch=()=>{if(output)output.innerHTML='<div class="mic-status">Речь не распознана. Попробуй снова.</div>'};r.start()}catch{toast('Не удалось запустить микрофон. Для него обычно нужен HTTPS и разрешение браузера.')}}
function uiStats(){let last7=Array.from({length:7},(_,i)=>plusDays(today(),i-6)),max=Math.max(10,...last7.map(d=>db.activity[d]?.xp||0));const total=db.history.length,lessonSessions=db.history.filter(x=>x.type==='lesson'),mean=lessonSessions.length?Math.round(lessonSessions.reduce((sum,x)=>sum+x.score,0)/lessonSessions.length):0;return `<section class="page-head"><h1>Твой прогресс 📈</h1><p>Здесь видно, сколько ты учишься, как продвигаешься по урокам и какие слова стоит повторить.</p></section><div class="kpi-grid"><div class="kpi"><div class="k-icon">⭐</div><div class="kpi-value">${db.xp}</div><div class="kpi-label">всего очков XP</div></div><div class="kpi orange"><div class="k-icon">🔥</div><div class="kpi-value">${db.streak}</div><div class="kpi-label">дней подряд</div></div><div class="kpi green"><div class="k-icon">🎓</div><div class="kpi-value">${countDone()}</div><div class="kpi-label">пройденных уроков</div></div></div><div class="grid-two" style="margin-top:19px"><div class="white-card"><h2>Активность за 7 дней</h2><p class="helper">Заработанные XP по дням</p><div class="chart">${last7.map(d=>{let n=db.activity[d]?.xp||0;return `<div class="chart-col"><div class="amount">${n}</div><div class="chart-bar" style="height:${Math.max(4,Math.round(n/max*138))}px;opacity:${n?1:.2}"></div><div class="day">${['вс','пн','вт','ср','чт','пт','сб'][new Date(d+'T12:00:00').getDay()]}</div></div>`}).join('')}</div></div><div class="white-card"><h2>Сводка обучения</h2><div class="daily-list"><div class="daily-row"><div class="daily-check done">✓</div><div><strong>${wordsKnown()} из ${totalWords()} слов</strong><small>Появлялись в упражнениях</small></div></div><div class="daily-row"><div class="daily-check done">✓</div><div><strong>${total} тренировок</strong><small>Все завершённые сессии</small></div></div><div class="daily-row"><div class="daily-check done">✓</div><div><strong>${mean}% средняя точность уроков</strong><small>На основе последних результатов</small></div></div><div class="daily-row"><div class="daily-check done">✓</div><div><strong>${dueWords().length} слов к повторению</strong><small>Повтори их сегодня</small></div><button class="btn btn-light btn-small" data-action="cards">Начать</button></div></div></div></div><div class="section-head"><h2>История занятий</h2></div><div class="white-card">${db.history.length?`<div class="recent">${db.history.slice(0,18).map(x=>`<div class="recent-item"><div class="num">${x.type==='lesson'?'🎓':x.type==='cards'?'🧠':x.type==='match'?'🧩':x.type==='dialog'?'🗣️':x.type==='listen'?'🎧':'✦'}</div><div><strong>${html(x.title)}</strong><br><small>${html(x.date)} · ${x.score}% правильных</small></div><div class="xp">+${x.xp} XP</div></div>`).join('')}</div>`:'<div class="empty-state"><div class="em">📊</div>Пока нет занятий. Пройди первый урок — и здесь появятся результаты.</div>'}</div>`}
function faqResponse(q){const n=norm(q);if(!n)return 'Напиши, что именно вызывает трудности. Например: «Почему soy и estoy разные?»';
 if(/(^|\s)(ser|estar|soy|estoy|эс|estar|сой|эстой)(\s|$)/.test(n))return 'SER (soy, eres, es…) — личность, профессия, происхождение. ESTAR (estoy, estás, está…) — местоположение и текущее состояние. Пример: Soy estudiante — я студент; Estoy en casa — я дома. Говоря «я из Малаги», используй Soy de Málaga.';
 if(/tener|tengo|tienes|возраст|сколько лет|лет/.test(n))return 'TENER означает «иметь»: yo tengo, tú tienes, él tiene, nosotros tenemos. В отличие от русского, о возрасте говорят через «иметь»: Tengo veinte años — мне 20 лет. También: Tengo hambre — я голоден.';
 if(/артикл|род|el |la |una|un |женск|мужск/.test(n))return 'Испанские существительные имеют род. Для определённых предметов: el (муж.) / la (жен.), для неопределённых: un / una. Учи вместе со словом: el libro, la casa. Окончания -o и -a помогают, но есть исключения.';
 if(/чита|звуч|произнош|букв|ll|ñ|j |h |ударен/.test(n))return 'Гласные A E I O U обычно звучат стабильно. H не произносится: hola → «ола». J напоминает «х»: jamón. Ñ — мягкое «нь»: España. LL в большинстве современных вариантов звучит примерно как «й». Нажимай 🔊 в словаре.';
 if(/глагол|окончани|инфинитив|habl|comer|vivir|работа/.test(n))return 'Инфинитив — словарная форма: hablar, comer, vivir. В настоящем времени с «я» обычно окончание -o: hablo, como, vivo. Для «ты»: hablas, comes, vives. Для «он/она»: habla, come, vive. Выучи по 1 глаголу каждого типа.';
 if(/называ|имя|знаком|как дела|привет|hola|buenos|buenas/.test(n))return 'Приветствие: Hola — привет; Buenos días — доброе утро / день; Buenas tardes — после полудня; Buenas noches — вечером / спокойной ночи. Разговорное «¡Buenas!» тоже используется. Представься: Me llamo ...; ¿Cómo te llamas? — как тебя зовут?';
 if(/деньг|цена|стоит|магазин|cuanto|cuánto|купить/.test(n))return 'В магазине спроси: ¿Cuánto cuesta? — сколько стоит? Para varias cosas: ¿Cuánto cuestan? — сколько стоят? ¿Puedo pagar con tarjeta? — можно оплатить картой?';
 if(/хочу|могу|quier|pued|заказ|кафе/.test(n))return 'Quiero — «я хочу», puedo — «я могу». После них другой глагол остаётся в инфинитиве: Quiero comer, Puedo hablar. Заказ: Quería un café con leche, por favor.';
 let l=lessonById(activeLesson);return `Вопрос интересный! Попробуй уточнить его одним правилом или словом — например «ser и estar», «артикли», «как читается ll». А пока подсказка из урока «${l.title}»: ${l.theory.rule}`;
}
function uiHelp(){return `<section class="page-head"><h1>Справочник и помощник 💡</h1><p>Здесь основные правила объясняются простым языком, с примерами. Вопросы обрабатывает встроенный справочник — это не подключённый онлайн-ИИ.</p></section><div class="white-card" style="margin-bottom:21px"><span class="overline">Не понял(а) правило?</span><h2 style="margin-top:9px">Спроси своими словами</h2><p class="helper">Например: «Почему yo soy, но yo estoy?», «Как использовать артикли?» или «Как произносить букву ñ?».</p><form id="helper-form"><input class="search" id="helper-query" value="${escAttr(helperQuery)}" placeholder="Напиши свой вопрос по испанскому…" aria-label="Спросить помощника"/><button class="btn btn-primary" type="submit" style="margin-top:11px">Объясни мне →</button></form>${helperAnswer?`<div class="tip-box"><strong>💬 Объяснение</strong><p>${html(helperAnswer)}</p></div>`:''}</div><div class="section-head"><h2>Частые вопросы новичков</h2></div>${FAQ.map((item,i)=>`<details class="details" ${faqOpen===i?'open':''}><summary>${html(item[0])}</summary><p>${html(item[1])}</p></details>`).join('')}<div class="section-head"><h2>Мини-справочник по грамматике</h2></div><div class="grid-two">${[{t:'SER · Кто я?',e:'Soy estudiante. Eres español. Ella es médica.'},{t:'ESTAR · Где я?',e:'Estoy en casa. Estamos en Málaga. Estoy bien.'},{t:'TENER · У меня есть',e:'Tengo un perro. Tengo hambre. Tengo 20 años.'},{t:'Структура вопросов',e:'¿Cómo te llamas? ¿Dónde está el banco? ¿Qué quieres?'},{t:'Настоящее время -AR',e:'hablo, hablas, habla, hablamos, habláis, hablan'},{t:'-ER и -IR',e:'como, comes, come / vivo, vives, vive'},{t:'Артикли',e:'el / la / los / las; un / una / unos / unas'},{t:'Ближайшее будущее',e:'Voy a estudiar. Vamos a comer. Va a trabajar.'}].map(x=>`<div class="white-card"><h3>${html(x.t)}</h3><div class="sample" style="font-size:13px">${html(x.e)}</div></div>`).join('')}</div>`}
function uiSettings(){return `<section class="page-head"><h1>Настройки ⚙️</h1><p>Подстрой обучение под себя и сохрани резервную копию прогресса, чтобы не потерять занятия.</p></section><div class="white-card center-wrap settings-list"><div class="settings-row"><div><b>Ежедневная цель XP</b><p>Помогает поддерживать регулярность, не ограничивает занятия.</p></div><div class="radio-inline">${[10,20,30,50].map(n=>`<button class="${db.goal===n?'selected':''}" data-action="set-goal" data-goal="${n}">${n}</button>`).join('')}</div></div><div class="settings-row"><div><b>Скорость испанской озвучки</b><p>Голос зависит от возможностей браузера и системы.</p></div><div class="radio-inline">${[[.72,'Медленно'],[.87,'Обычно'],[1,'Быстро']].map(x=>`<button class="${db.soundRate===x[0]?'selected':''}" data-action="set-rate" data-rate="${x[0]}">${x[1]}</button>`).join('')}</div></div><div class="settings-row"><div><b>Скачать резервную копию</b><p>JSON-файл с уроками, словами и историей. При переносе на iPhone импортируй его на новом устройстве.</p></div><button class="btn btn-light" data-action="export">↓ Экспорт</button></div><div class="settings-row"><div><b>Восстановить прогресс</b><p>Выбери ранее скачанный JSON. Текущий прогресс будет заменён данными из файла.</p></div><label class="btn btn-outline" for="import-file">↑ Импорт</label><input id="import-file" type="file" accept="application/json,.json" style="display:none" /></div><div class="settings-row"><div><b>Начать обучение заново</b><p>Удалит весь прогресс в текущем браузере. Отменить без резервной копии нельзя.</p></div><button class="btn btn-coral" data-action="reset">Сбросить</button></div></div><div class="center-wrap tip-box warning"><strong>Важно для использования каждый день</strong><p>Сайт не требует регистрации. Данные хранятся локально через localStorage. В приватном режиме или после очистки данных браузера они могут исчезнуть. Если открывать сайт по разным адресам, браузер может воспринимать их как разные хранилища.</p></div>`}
function render(){let content={home:uiHome,lessons:uiLessons,theory:uiTheory,exercise:uiExercise,results:uiResults,words:uiWords,games:uiGames,match:uiMatch,cards:uiCards,dialog:uiDialog,pronounce:uiPronounce,stats:uiStats,help:uiHelp,settings:uiSettings}[page];app.innerHTML=chrome(content?content():'<p>Раздел не найден.</p>');document.title=`${pageName()} — ¡Vamos!`;}
function doExport(){const blob=new Blob([JSON.stringify({app:'vamos-es',version:1,exported:new Date().toISOString(),state:db},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`vamos-progress-${today()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Резервная копия подготовлена. Сохрани файл в надёжном месте.')}
async function doImport(input){const file=input.files?.[0];if(!file)return;try{if(file.size>2e6)throw Error('Слишком большой файл.');const parsed=JSON.parse(await file.text());if(parsed.app!=='vamos-es'||!parsed.state||typeof parsed.state!=='object')throw Error('Это не резервная копия ¡Vamos!.');if(!confirm('Заменить текущий прогресс данными из резервной копии?'))return;let s=parsed.state;db={...blankState(),...s,xp:Math.max(0,Number(s.xp)||0),goal:[10,20,30,50].includes(s.goal)?s.goal:20,history:Array.isArray(s.history)?s.history.slice(0,90):[],wordStats:s.wordStats&&typeof s.wordStats==='object'?s.wordStats:{},finished:s.finished&&typeof s.finished==='object'?s.finished:{},activity:s.activity&&typeof s.activity==='object'?s.activity:{}};save();go('home');toast('Прогресс восстановлен.')}catch(e){toast('Не удалось импортировать: '+e.message)}}
function handleAction(a,button){const id=Number(button.dataset.id||activeLesson);switch(a){
 case 'nav':go(button.dataset.page);break;
 case 'lesson':activeLesson=id;go('theory');break;
 case 'start-lesson':startLesson(id);break;
 case 'speak':spoken(button.dataset.text);break;
 case 'answer':checkAnswer(Number(button.dataset.answer));break;
 case 'hint':if(session){session.hint=!session.hint;render()}break;
 case 'next':moveNext();break;
 case 'exit-exercise':go(session?.type==='lesson'?'theory':'games');break;
 case 'add-token':if(!session||session.locked)break;{let q=currentEx(),i=Number(button.dataset.index);if(!session.selected.some(v=>v.id===i)){session.selected.push({id:i,text:q.tokens[i]});render()}}break;
 case 'remove-token':if(!session||session.locked)break;session.selected.splice(Number(button.dataset.index),1);render();break;
 case 'check-build':checkAnswer(session?.selected.map(x=>x.text).join(' ')||'');break;
 case 'cards':startCards();break;
 case 'flip':if(cardSession){cardSession.flipped=!cardSession.flipped;render()}break;
 case 'rate-card':rateCard(button.dataset.rating);break;
 case 'word-filter':wordFilter=button.dataset.filter;render();break;
 case 'word-unit':selectedUnit=button.dataset.unit;render();break;
 case 'start-game':startGame(button.dataset.mode,activeLesson);break;
 case 'match-tile':matchTile(Number(button.dataset.index));break;
 case 'dialog':dialogSession={story:0,turn:0,locked:false,answer:null,correct:0,xp:0};go('dialog');break;
 case 'dialog-answer':dialogAnswer(Number(button.dataset.index));break;
 case 'dialog-next-turn':dialogNextTurn();break;
 case 'dialog-next-story':{const next=(dialogSession.story+1)%DIALOGS.length;dialogSession={story:next,turn:0,locked:false,answer:null,correct:0,xp:0};render();scrollTo({top:0,behavior:'instant'})}break;
 case 'pronounce-lesson':startPronounce(id);break;
 case 'pronounce-next':pronounceIndex=(pronounceIndex+1)%lessonById(activeLesson).words.length;render();break;
 case 'pronounce-prev':pronounceIndex=Math.max(0,pronounceIndex-1);render();break;
 case 'mic':micCheck(button.dataset.text);break;
 case 'set-goal':db.goal=Number(button.dataset.goal);save();render();break;
 case 'set-rate':db.soundRate=Number(button.dataset.rate);save();render();spoken('Hola, buenos días');break;
 case 'export':doExport();break;
 case 'reset':if(confirm('Точно удалить все уроки, XP, карточки и историю на этом устройстве? Сначала сохрани резервную копию, если данные важны.')){db=blankState();save();go('home');toast('Обучение начато заново.')}break;
 }}
document.addEventListener('click',e=>{let button=e.target.closest('[data-action]');if(!button||button.disabled)return;handleAction(button.dataset.action,button)});
document.addEventListener('submit',e=>{if(e.target.id==='text-answer-form'){e.preventDefault();const val=document.getElementById('text-answer')?.value||'';if(!val.trim())return toast('Напиши ответ перед проверкой.');checkAnswer(val)}if(e.target.id==='helper-form'){e.preventDefault();helperQuery=document.getElementById('helper-query')?.value?.trim()||'';helperAnswer=faqResponse(helperQuery);render()}});
document.addEventListener('change',e=>{if(e.target.id==='game-lesson')activeLesson=Number(e.target.value);if(e.target.id==='import-file')doImport(e.target)});
document.addEventListener('input',e=>{if(e.target.id==='word-search'){let val=e.target.value,sel=e.target.selectionStart;wordSearch=val;render();let el=document.getElementById('word-search');el?.focus();el?.setSelectionRange(sel,sel)}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button][data-action=lesson]')){e.preventDefault();handleAction('lesson',e.target)}});
render();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});

</script>
